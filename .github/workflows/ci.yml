name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Branded Chrome >= 137 ignores --load-extension; Chrome for Testing keeps it.
      - name: Install Chrome for Testing
        run: echo "CHROME_PATH=$(npx -y @puppeteer/browsers install chrome@stable --path "$HOME/.cache/cft" | tail -1 | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: End-to-end test in Chrome
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: .e2e-profile/screenshots
