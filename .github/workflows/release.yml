name: Release

# Releases are cut automatically: when the version in package.json on main has no GitHub
# release yet, this workflow tests, packages and publishes v<version> (creating the tag).
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Build prebuilt archive
        if: steps.version.outputs.exists == 'false'
        run: ./scripts/package-release.sh
      - name: Release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"; VERSION="${TAG#v}"
          {
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            cat <<'NOTES'

          ## Install (CachyOS / Arch)

          ```bash
          sudo pacman -S --needed nodejs git
          curl -L -o /tmp/repomind.tar.gz https://github.com/cyb3rl00m/repo-mind/releases/latest/download/repomind-prebuilt.tar.gz
          tar -xzf /tmp/repomind.tar.gz -C ~
          cd ~/repomind && ./scripts/install.sh --no-build
          ```

          Then `chrome://extensions` → Developer mode → **Load unpacked** → `~/repomind/packages/extension/dist`.
          Updating: replace `~/repomind`, run the installer again, reload the extension. See the README for setup.
          NOTES
          } | sed 's/^          //' > release-notes.md
          cat release-notes.md
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            release/repomind-prebuilt.tar.gz release/repomind-prebuilt.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "RepoMind ${TAG#v}" --notes-file release-notes.md --latest
